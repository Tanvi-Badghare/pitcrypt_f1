[package]
name = "zkp-module"
version = "0.1.0"
edition = "2021"
description = "Combined integrity + sequence zero-knowledge proof module for PitCrypt-F1"

[dependencies]
curve25519-dalek = { version = "4.1", features = ["rand_core", "digest"] }
merlin = "3.0"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "1.0"

[dev-dependencies]
rand = "0.8"